<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Zorin XP (login screen): Arial as in XP with "Standard" smoothing, by the
  font's own 'gasp' table: up to 8 ppem greyscale, 9..17 unsmoothed
  (grid-fit), above 17 smoothed. (Bold italic only has the unsmoothed range
  up to 11.) Only installed for the gdm user.
-->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Arial</string></test>
    <test name="slant" compare="eq"><const>roman</const></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>17.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
