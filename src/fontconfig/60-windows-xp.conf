<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Zorin XP: renderização dos tipos de letra do XP como no Windows XP com a
  suavização "Padrão" (ClearType desligado, o valor por omissão do XP).

  O Windows respeitava a tabela 'gasp' de cada tipo de letra:
    ppem <= 8         -> tons de cinzento, sem grid-fit
    8 < ppem <= LIMITE -> grid-fit, SEM suavização (texto "nítido" do XP)
    ppem > LIMITE      -> grid-fit + tons de cinzento
  LIMITE = 16 (Tahoma, Trebuchet, Verdana, Franklin), 11 (Trebuchet Bold),
  18 (Microsoft Sans Serif). Lucida Console não tem 'gasp': tratada como 16.
-->
<fontconfig>
  <!-- "Franklin Gothic Medium" escrito numa descrição de tipo de letra do Pango
       é lido como família "Franklin Gothic" + peso "Medium" e falha; este nome
       alternativo evita isso (usado pelo tema do Shell: menu Iniciar) -->
  <alias binding="same">
    <family>Franklin Gothic XP</family>
    <prefer><family>Franklin Gothic Medium</family></prefer>
  </alias>
  <!-- Hinting TrueType completo, sem subpíxel, para as fontes do XP -->
  <match target="font">
    <test name="family" compare="eq">
<string>Tahoma</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Trebuchet MS</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Verdana</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Franklin Gothic Medium</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Microsoft Sans Serif</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Lucida Console</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- Faixa sem suavização: limite 16 -->
  <match target="font">
    <test name="family" compare="eq">
<string>Tahoma</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Verdana</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Franklin Gothic Medium</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Lucida Console</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Trebuchet MS: regular/itálico até 16, negrito até 11 -->
  <match target="font">
    <test name="family" compare="eq"><string>Trebuchet MS</string></test>
    <test name="weight" compare="less"><const>bold</const></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Trebuchet MS</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>11.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Microsoft Sans Serif: até 18 -->
  <match target="font">
    <test name="family" compare="eq"><string>Microsoft Sans Serif</string></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>18.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
