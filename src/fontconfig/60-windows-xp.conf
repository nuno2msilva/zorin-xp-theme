<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Zorin XP: rendering of the XP fonts as in Windows XP with "Standard"
  smoothing (ClearType off, XP's default).

  Windows followed each font's 'gasp' table:
    ppem <= 8          -> greyscale, no grid-fit
    8 < ppem <= LIMIT  -> grid-fit, NO smoothing (XP's "crisp" text)
    ppem > LIMIT       -> grid-fit + greyscale
  LIMIT = 16 (Tahoma, Trebuchet, Verdana, Franklin), 11 (Trebuchet Bold),
  18 (Microsoft Sans Serif). Lucida Console has no 'gasp': treated as 16.
-->
<fontconfig>
  <!-- "Franklin Gothic Medium" written in a Pango font description is read
       as family "Franklin Gothic" + weight "Medium" and fails; this
       alternative name avoids that (used by the Shell theme: Start menu) -->
  <alias binding="same">
    <family>Franklin Gothic XP</family>
    <prefer><family>Franklin Gothic Medium</family></prefer>
  </alias>
  <!-- Full TrueType hinting, no subpixel, for the XP fonts -->
  <match target="font">
    <test name="family" compare="eq">
<string>Tahoma</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Trebuchet MS</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Verdana</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Franklin Gothic Medium</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Microsoft Sans Serif</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Lucida Console</string>    </test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <!-- Unsmoothed range: limit 16 -->
  <match target="font">
    <test name="family" compare="eq">
<string>Tahoma</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Verdana</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Franklin Gothic Medium</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
<string>Lucida Console</string>    </test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Trebuchet MS: regular/italic up to 16, bold up to 11 -->
  <match target="font">
    <test name="family" compare="eq"><string>Trebuchet MS</string></test>
    <test name="weight" compare="less"><const>bold</const></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>16.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Trebuchet MS</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>11.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Microsoft Sans Serif: up to 18 -->
  <match target="font">
    <test name="family" compare="eq"><string>Microsoft Sans Serif</string></test>
    <test name="pixelsize" compare="more"><double>8.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>18.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
